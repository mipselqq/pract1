name: pract1
services:
  minio:
    image: pgsty/silo:latest@sha256:aaac6bce13eb99316b3c88bd20143fc3c38ab607585256a411a095c44ee57f62
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  migrate:
    image: quay.io/lakekeeper/catalog:latest-main@sha256:6edf0dcfdd78504d0319a42ed66009ba94b956eaa7ac237495ef6a948d119f47
    command: migrate
    environment: &lakekeeper_env
      LAKEKEEPER__PG_ENCRYPTION_KEY: This-is-NOT-Secure!
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:postgres@postgres:5432/postgres
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main@sha256:6edf0dcfdd78504d0319a42ed66009ba94b956eaa7ac237495ef6a948d119f47
    command: serve
    environment: *lakekeeper_env
    ports:
      - "8181:8181"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  trino:
    image: trinodb/trino:476
    ports:
      - "8080:8080"
    volumes:
      - ./catalog:/etc/trino/catalog:ro
    depends_on:
      - minio
      - lakekeeper
    restart: unless-stopped
volumes:
  minio-data:
  pg-data:
